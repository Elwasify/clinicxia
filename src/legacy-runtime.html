  // ==========================================
  // DYNAMIC QUEUE STATE & CLINIC STATUS ENGINE
  // Single Source of Truth
  // ==========================================
  function syncClinicAndQueueState() {
    const queueRows = document.querySelectorAll('#queue-table-body tr');
    let activePatientInside = null;
    let nextWaitingPatient = null;
    let waitingCount = 0;

    queueRows.forEach(row => {
      const status = row.getAttribute('data-status');
      const turn = row.getAttribute('data-turn');
      const nameEl = row.querySelector('td:nth-child(3) span:first-child');
      const name = nameEl ? nameEl.textContent.trim() : '';

      if (status === 'inside' && !activePatientInside) {
        activePatientInside = { turn, name, row };
      } else if (status === 'next' || status === 'waiting') {
        waitingCount++;
        if (!nextWaitingPatient) {
          nextWaitingPatient = { turn, name, row };
        }
      }
    });

    // Update Clinic Status Card (STATUS-ONLY, Receptionist has no toggle button)
    const statusBadge = document.getElementById('clinic-status-badge');
    const statusDot = document.getElementById('clinic-status-dot');
    const statusText = document.getElementById('clinic-status-text');
    const activeBox = document.getElementById('clinic-active-patient-box');

    // Update Counter metric for in-consultation
    const metricTurn = document.getElementById('metric-consultation-turn');
    const metricName = document.getElementById('metric-consultation-name');
    const metricTime = document.getElementById('metric-consultation-time');
    const metricBar = document.getElementById('metric-consultation-bar');
    const metricWait = document.getElementById('metric-waiting-count');

    if (metricWait) {
      metricWait.textContent = String(waitingCount).padStart(2, '0');
    }

    if (activePatientInside) {
      // 1. Clinic is busy
      if (statusBadge) {
        statusBadge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-50 text-[#DC2626] border border-red-200 text-[12px] font-bold';
      }
      if (statusDot) {
        statusDot.className = 'w-2 h-2 rounded-full bg-[#DC2626] animate-pulse';
      }
      if (statusText) {
        statusText.textContent = 'العيادة مشغولة حالياً';
      }
      if (activeBox) {
        activeBox.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-[#DC2626] text-white flex items-center justify-center font-bold text-[14px]">
              ${activePatientInside.turn}
            </div>
            <div class="flex flex-col">
              <span class="text-[14px] font-bold text-[#0B2545]">${activePatientInside.name}</span>
              <span class="text-[12px] text-[#64748B]">داخل الكشف منذ لحظات — فحص سريري وسونار</span>
            </div>
          </div>
        `;
      }
      if (metricTurn) metricTurn.textContent = activePatientInside.turn;
      if (metricName) metricName.textContent = activePatientInside.name;
      if (metricTime) metricTime.textContent = 'داخل الكشف حالياً';
      if (metricBar) metricBar.style.width = '75%';
    } else {
      // 2. Clinic is available
      if (statusBadge) {
        statusBadge.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[12px] font-bold';
      }
      if (statusDot) {
        statusDot.className = 'w-2 h-2 rounded-full bg-[#16A34A]';
      }
      if (statusText) {
        statusText.textContent = 'العيادة متاحة وجاهزة';
      }
      if (activeBox) {
        activeBox.innerHTML = `
          <div class="flex items-center gap-3 py-1 text-emerald-800">
            <span class="material-symbols-outlined text-[#0F7C82] text-[24px]">check_circle</span>
            <span class="text-[13.5px] font-bold text-[#0B2545]">لا يوجد مريض داخل الكشف الآن — الطبيب بانتظار الحالة التالية</span>
          </div>
        `;
      }
      if (metricTurn) metricTurn.textContent = '--';
      if (metricName) metricName.textContent = 'لا يوجد مريض';
      if (metricTime) metricTime.textContent = 'العيادة شاغرة';
      if (metricBar) metricBar.style.width = '0%';
    }

    // Update Next-in-line Banner
    const nextTurnBadge = document.getElementById('next-banner-queue-turn');
    const nextNameEl = document.getElementById('next-banner-name');
    const nextAvatar = document.getElementById('next-banner-avatar');
    const nextDispatchBtn = document.getElementById('btn-next-dispatch');

    if (nextWaitingPatient) {
      if (nextTurnBadge) nextTurnBadge.textContent = 'رقم ' + nextWaitingPatient.turn + ' في الطابور';
      if (nextNameEl) nextNameEl.textContent = nextWaitingPatient.name;
      if (nextAvatar) nextAvatar.textContent = nextWaitingPatient.name.charAt(0);
      if (nextDispatchBtn) {
        nextDispatchBtn.setAttribute('onclick', `dispatchPatient(event, '${nextWaitingPatient.turn}', '${nextWaitingPatient.name}')`);
        nextDispatchBtn.classList.remove('opacity-50', 'pointer-events-none');
      }
    } else {
      if (nextTurnBadge) nextTurnBadge.textContent = 'لا يوجد انتظار';
      if (nextNameEl) nextNameEl.textContent = 'لا توجد حالات تالية في الطابور';
      if (nextAvatar) nextAvatar.textContent = '-';
      if (nextDispatchBtn) {
        nextDispatchBtn.classList.add('opacity-50', 'pointer-events-none');
      }
    }
  }

  function searchPatientForBooking() {
    const input = document.getElementById('modal-patient-code-input');
    const errEl = document.getElementById('booking-search-error');
    if (!input) return;
    const rawVal = input.value.trim().toUpperCase();
    if (!rawVal) {
      if (errEl) {
        errEl.textContent = 'يرجى إدخال كود المريض أولاً للبحث';
        errEl.classList.remove('hidden');
      }
      return;
    }

    let match = REGISTERED_PATIENTS[rawVal];
    if (!match) {
      const keys = Object.keys(REGISTERED_PATIENTS);
      const foundKey = keys.find(k => k.toLowerCase() === rawVal.toLowerCase() || k.endsWith(rawVal));
      if (foundKey) match = REGISTERED_PATIENTS[foundKey];
    }

    if (match) {
      if (errEl) errEl.classList.add('hidden');
      displayBookingPatient(match.code, match.name, match.phone, match.defaultType, match.validityText, match.confirmLabel);
    } else {
      if (errEl) {
        errEl.textContent = 'لم يتم العثور على مريض مسجل بالكود (' + rawVal + '). يرجى التأكد من كتابة الكود بشكل صحيح.';
        errEl.classList.remove('hidden');
      }
    }
  }

  function displayBookingPatient(code, name, phone, visitType, validity, confirmText) {
    const nameEl = document.getElementById('modal-patient-name');
    const codeEl = document.getElementById('modal-patient-code');
    const phoneEl = document.getElementById('modal-patient-phone');
    const validEl = document.getElementById('modal-reconsult-validity');
    const summaryCard = document.getElementById('booking-patient-summary');
    const eligibilitySec = document.getElementById('booking-eligibility-section');
    const confirmBtn = document.getElementById('btn-booking-confirm');
    const confirmLabel = document.getElementById('btn-booking-confirm-label');

    if (nameEl) nameEl.textContent = name || '—';
    if (codeEl) codeEl.textContent = code || '—';
    if (phoneEl) phoneEl.textContent = phone || '—';
    if (validEl) validEl.textContent = validity || 'سارية';

    if (summaryCard) summaryCard.classList.remove('hidden');
    if (eligibilitySec) eligibilitySec.classList.remove('hidden');
    if (confirmBtn) confirmBtn.removeAttribute('disabled');

    const vType = visitType === 'old' ? 'new' : (visitType || 'new');
    setVisitType(vType);

    if (confirmText && confirmLabel) {
      confirmLabel.textContent = confirmText;
    }
  }

  function saveNewPatient() {
    const name = document.getElementById('reg-name')?.value.trim() || 'مريض جديد';
    closeRegistrationModal();
    const toast = document.getElementById('toast-dispatch');
    const patEl = document.getElementById('toast-dispatch-patient');
    if (patEl) patEl.textContent = 'تم تسجيل ملف المريض: ' + name;
    if (toast) {
      toast.classList.remove('hidden');
      setTimeout(() => { if (toast) toast.classList.add('hidden'); }, 3500);
    }
  }

  function toggleAllergyInput() {
    const sel = document.getElementById('reg-allergy-select');
    const inp = document.getElementById('reg-allergy-detail');
    if (sel && inp) {
      if (sel.value === 'نعم') inp.classList.remove('hidden');
      else inp.classList.add('hidden');
    }
  }

  let currentVisitType = 'reconsult';
  function setVisitType(type) {
    currentVisitType = type;
    const btnNew = document.getElementById('btn-visit-new');
    const btnRe = document.getElementById('btn-visit-reconsult');
    const btnFollow = document.getElementById('btn-visit-followup');
    const confirmLabel = document.getElementById('btn-booking-confirm-label');
    if (btnNew) btnNew.className = 'p-3 rounded-xl border border-[#CBD5E1] bg-white hover:bg-slate-50 flex flex-col items-center justify-center text-center cursor-pointer transition-colors';
    if (btnRe) btnRe.className = 'p-3 rounded-xl border border-[#CBD5E1] bg-white hover:bg-slate-50 flex flex-col items-center justify-center text-center cursor-pointer transition-colors';
    if (btnFollow) btnFollow.className = 'p-3 rounded-xl border border-[#CBD5E1] bg-white hover:bg-slate-50 flex flex-col items-center justify-center text-center cursor-pointer transition-colors';
    if (type === 'new') {
      if (btnNew) btnNew.className = 'p-3 rounded-xl border-2 border-[#0F7C82] bg-emerald-50/40 flex flex-col items-center justify-center text-center cursor-pointer transition-colors';
      if (confirmLabel) confirmLabel.textContent = 'تحصيل 350 ج.م وإضافة للطابور';
    } else if (type === 'reconsult') {
      if (btnRe) btnRe.className = 'p-3 rounded-xl border-2 border-[#0F7C82] bg-emerald-50/40 flex flex-col items-center justify-center text-center cursor-pointer transition-colors';
      if (confirmLabel) confirmLabel.textContent = 'تحصيل 150 ج.م وإضافة للطابور';
    } else if (type === 'followup') {
      if (btnFollow) btnFollow.className = 'p-3 rounded-xl border-2 border-[#0F7C82] bg-cyan-50/50 flex flex-col items-center justify-center text-center cursor-pointer transition-colors';
      if (confirmLabel) confirmLabel.textContent = 'تأكيد المتابعة (0 ج.م)';
    }
  }

  function confirmBooking() {
    const name = document.getElementById('modal-patient-name')?.textContent;
    if (!name || name === '—') return;
    closeBookingModal();
    const toast = document.getElementById('toast-dispatch');
    const patEl = document.getElementById('toast-dispatch-patient');
    if (patEl) patEl.textContent = 'تم إدراج المريض ' + name + ' في الطابور';
    if (toast) {
      toast.classList.remove('hidden');
      setTimeout(() => { if (toast) toast.classList.add('hidden'); }, 3500);
    }
  }

  function resumePatientVisit(turn, name) {
    closeResumeModal();
    // Locate row if exists or dispatch directly
    const row = document.getElementById('queue-row-' + turn);
    if (row) {

function exam(e){const p=P(e.code),d=dr(e.t);if(d.c==null)d.c=e.sub.split('—').slice(1).join('—').trim()||e.sub;if(!d.rx)d.rx=[{n:'',d:'',u:''}];
const F=(k,l,r)=>`<div><div class="flex items-center justify-between"><label class="${LB}">${l}</label><button type="button" onclick="CX.mic('${k}',this)" class="text-[#0F7C82] text-[12px] font-bold flex items-center gap-1">${ic('mic')}إملاء</button></div><textarea id="f-${k}" rows="${r}" class="${IN}" oninput="CX.dr('${k}',this.value)">${E(d[k])}</textarea></div>`;
return`<div class="${C}"><div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-[#E2E8F0]"><div class="flex items-center gap-3"><div class="w-12 h-12 rounded-xl bg-[#DC2626] text-white flex items-center justify-center font-bold text-[18px]">${e.t}</div><div><h3 class="font-bold text-[19px] text-[#0B2545]">${E(e.name)}</h3><div class="text-[13px] text-[#64748B]">${p.age?p.age+' سنة':''} ${E(p.gender)} • <span class="font-mono ltr-text">${E(e.code)}</span></div></div></div><div class="flex gap-2"><button type="button" class="${B2}" onclick="CX.print()">${ic('print')}طباعة الروشتة</button><button type="button" class="${B1}" onclick="CX.finish()">${ic('save')}حفظ وإنهاء الكشف</button></div></div>
${p.al?`<div class="mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-[#DC2626] font-bold text-[13px]">${ic('warning')} حساسية: ${E(p.al)}</div>`:''}<div class="mt-3">${p.h?hView(p.h):''}</div>
<div class="grid md:grid-cols-2 gap-4 mt-4">${F('c','الشكوى',3)}${F('notes','ملاحظات الكشف',3)}${F('dx','التشخيص',3)}${F('tx','العلاج / التوصيات',3)}</div>
<div class="mt-4"><div class="flex items-center justify-between mb-2"><h4 class="font-bold text-[14px] text-[#0B2545]">الروشتة</h4><button type="button" class="${B2} !h-8" onclick="CX.addRx()">${ic('add')}دواء</button></div>${d.rx.map((r,i)=>`<div class="grid grid-cols-12 gap-2 mb-2"><input class="${IN} col-span-5" placeholder="اسم الدواء" value="${E(r.n)}" oninput="CX.rx(${i},'n',this.value)"><input class="${IN} col-span-4" placeholder="الجرعة" value="${E(r.d)}" oninput="CX.rx(${i},'d',this.value)"><input class="${IN} col-span-2" placeholder="المدة" value="${E(r.u)}" oninput="CX.rx(${i},'u',this.value)"><button type="button" class="col-span-1 text-[#DC2626]" onclick="CX.delRx(${i})">${ic('delete')}</button></div>`).join('')}</div></div>`}
function tPatients(){return`<div class="${C}"><h3 class="font-bold text-[17px] text-[#0B2545] mb-4">ملخص اليوم</h3><div id="psum"></div></div><div class="${C} mt-5"><div class="flex flex-wrap gap-3 mb-4"><input id="psearch" class="${IN} flex-1 min-w-[240px]" placeholder="ابحث بالاسم أو الكود أو رقم الهاتف..." oninput="CX.search(this.value)" value="${E(mq)}"><button type="button" class="${B1}" onclick="CX.edit('')">${ic('person_add')}تسجيل مريض جديد</button></div><div id="pres"></div></div>`}
function pSum(){const d0=new Date().toDateString(),vs=[];Object.keys(S.p).forEach(c=>(S.p[c].visits||[]).forEach(v=>{if(new Date(v.d).toDateString()===d0)vs.push(v)}));const seen=S.q.filter(e=>e.st==='done').length;
$('psum').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">${[['اتكشف',seen],['في الطابور',act()],['فاضل للحد',Math.max(0,S.s.cap-seen)],['الانتهاء المتوقع',act()?tm(finD()):'—']].map(x=>`<div class="bg-slate-50 rounded-lg p-3"><div class="font-mono text-[22px] font-bold text-[#0F7C82]">${x[1]}</div><div class="text-[12px] text-[#64748B]">${x[0]}</div></div>`).join('')}</div>${vs.length?`<div class="mt-4 text-[13px]">${vs.map(v=>`<div class="py-2 border-b border-slate-100"><b>${E(v.n)}</b> — ${E(v.dx||v.notes)}</div>`).join('')}</div>`:'<p class="text-[12.5px] text-[#64748B] mt-3">لسه مفيش كشوفات اتسجلت النهارده.</p>'}`}
function pRes(){const q=mq.trim().toLowerCase();let l=allCodes().map(P).filter(p=>!q||p.name.toLowerCase().indexOf(q)>-1||p.code.indexOf(q)>-1||String(p.phone).indexOf(q)>-1);const n=l.length;l=l.slice(0,30);
$('pres').innerHTML=`<div class="overflow-x-auto w-full"><table class="w-full text-right text-[13.5px]"><thead class="bg-[#F1F5F9] text-[#0B2545] font-bold"><tr><th class="p-3">الكود</th><th class="p-3">الاسم</th><th class="p-3">الهاتف</th><th class="p-3">السن</th><th class="p-3 text-center">إجراءات</th></tr></thead><tbody class="divide-y divide-[#E2E8F0]">${l.map(p=>`<tr><td class="p-3 font-mono ltr-text">${E(p.code)}</td><td class="p-3 font-bold">${E(p.name)}</td><td class="p-3 font-mono ltr-text">${E(p.phone)}</td><td class="p-3">${p.age}</td><td class="p-3 text-center whitespace-nowrap"><button type="button" class="text-[#0F7C82] font-bold ml-3" onclick="CX.view('${p.code}')">السجل</button><button type="button" class="text-[#0B2545] font-bold" onclick="CX.edit('${p.code}')">تعديل</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-6 text-center text-[#64748B]">لا توجد نتائج</td></tr>'}</tbody></table></div><p class="text-[12px] text-[#64748B] mt-2">عرض ${l.length} من ${n} مريض</p>`}
function modal(h){const m=$('cx-modal');m.className='fixed inset-0 z-[60] bg-[#0B2545]/60 flex items-center justify-center p-4';m.innerHTML=`<div class="bg-white rounded-xl shadow-2xl w-full max-w-[720px] max-h-[90vh] overflow-y-auto p-6 text-right">${h}</div>`;m.onclick=e=>{if(e.target===m)CX.close()}}
function renderD(){const b=$('dbody'),nv=$('dnav');nv.innerHTML=dnav();
if(dtab==='reception'){if(b.dataset.tab==='reception'&&document.activeElement&&document.activeElement.tagName==='INPUT'&&b.contains(document.activeElement))return;b.innerHTML=tReception();b.dataset.tab='reception'}
else if(dtab==='room'){const ins=S.q.find(e=>e.st==='inside'),k=JSON.stringify([ins&&ins.t,S.q.filter(e=>e.st==='sent').map(e=>e.t),sel]);if(b.dataset.tab==='room'&&k===roomKey)return;roomKey=k;b.innerHTML=tRoom();b.dataset.tab='room'}
else{if(b.dataset.tab!=='patients'){b.innerHTML=tPatients();b.dataset.tab='patients';pRes()}pSum()}}
function render(){renderR();const n=sentN(),bg=$('cx-badge');bg.textContent=n;bg.classList.toggle('hidden',!n);document.title=(mode==='d'&&n?'('+n+') ':'')+'كلينيكسيا';if(mode==='d')renderD()}
function setMode(m){mode=m;try{sessionStorage.setItem('cx_mode',m)}catch(e){}const d=m==='d';RV.style.display=d?'none':'';document.querySelector('nav').style.display=d?'none':'';$('doctor-root').classList.toggle('hidden',!d);$('cx-m-r').className='px-4 py-1 rounded-md font-bold '+(d?'text-white/80 hover:bg-white/10':'bg-white text-[#0B2545]');$('cx-m-d').className='px-4 py-1 rounded-md font-bold flex items-center gap-2 '+(d?'bg-white text-[#0B2545]':'text-white/80 hover:bg-white/10');
if(U){U.n.textContent=d?'أ.د. عفيفي فهمي':'إسلام أحمد نور';U.r.textContent=d?'الطبيب':'موظف استقبال';U.a.textContent=d?'ع':'إ'}$('dbody').dataset.tab='';render()}
function notify(prev){if(!prev)return;const nw=S.q.filter(e=>e.st==='sent'&&!(prev.q.find(x=>x.t===e.t&&x.st==='sent')));if(nw.length&&mode==='d'){beep();toast('مريض جديد وصل للطبيب',nw.map(e=>e.name).join('، '))}}
function sync(){const prev=S;const n=load();if(!n)return;S=n;notify(prev);render()}
/* ---------- public handlers ---------- */
function printRx(name,age,date,dx,rx){const el=$('cx-print');el.innerHTML=`<div dir="rtl" style="font-family:Cairo,sans-serif;padding:24px"><div style="text-align:center;border-bottom:2px solid #0B2545;padding-bottom:10px"><h2 style="margin:0;color:#0B2545">عيادة أ.د. عفيفي فهمي عفيفي أحمد</h2><div style="color:#0F7C82">دكتوراه الأمراض الباطنية — استشاري الكبد والجهاز الهضمي</div></div><p><b>المريض:</b> ${E(name)} ${age?'— '+age+' سنة':''} &nbsp;&nbsp; <b>التاريخ:</b> ${E(date)}</p>${dx?`<p><b>التشخيص:</b> ${E(dx)}</p>`:''}<h3 style="font-size:28px;margin:16px 0 8px">℞</h3><ol>${rx.filter(r=>r.n).map(r=>`<li style="margin-bottom:8px"><b>${E(r.n)}</b> — ${E(r.d)} ${r.u?'— '+E(r.u):''}</li>`).join('')}</ol></div>`;window.print()}
window.CX={tab:t=>{dtab=t;$('dbody').dataset.tab='';roomKey='';renderD()},sel:t=>{sel=t;renderD()},
set:(k,v)=>{S.s[k]=k==='exit'?(v||'22:00'):Math.max(1,+v||1);save();$('dbody').dataset.tab='';render();if(k==='cap')toast('تم تحديث الحد اليومي',S.s.cap+' كشف')},
enter:t=>{const e=S.q.find(x=>x.t===t);if(!e)return;if($('hh-chronic')){SP(e.code).h=getH('hh-')}e.st='inside';roomKey='';save();render()},
dr:(k,v)=>{const e=S.q.find(x=>x.st==='inside');if(e){dr(e.t)[k]=v;save()}},
rx:(i,k,v)=>{const e=S.q.find(x=>x.st==='inside');if(e){dr(e.t).rx[i][k]=v;save()}},
addRx:()=>{const e=S.q.find(x=>x.st==='inside');dr(e.t).rx.push({n:'',d:'',u:''});roomKey='';save();renderD()},
delRx:i=>{const e=S.q.find(x=>x.st==='inside'),r=dr(e.t).rx;r.splice(i,1);if(!r.length)r.push({n:'',d:'',u:''});roomKey='';save();renderD()},
mic:(k,b)=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('الإملاء الصوتي مش مدعوم في المتصفح ده','جرّب Chrome',1);return}if(rec){rec.stop();return}const el=$('f-'+k);rec=new SR();rec.lang='ar-EG';rec.continuous=true;rec.interimResults=false;b.classList.add('animate-pulse');rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)el.value+=(el.value?' ':'')+ev.results[i][0].transcript;CX.dr(k,el.value)};rec.onend=()=>{rec=null;b.classList.remove('animate-pulse')};rec.onerror=()=>{};try{rec.start()}catch(e){rec=null}},
print:()=>{const e=S.q.find(x=>x.st==='inside'),d=dr(e.t),p=P(e.code);printRx(e.name,p.age,fd(Date.now()),d.dx,d.rx||[])},
finish:()=>{const e=S.q.find(x=>x.st==='inside'),d=dr(e.t);if(!(d.dx||d.notes)){toast('اكتب التشخيص أو الملاحظات الأول','',1);return}const x=SP(e.code);x.visits=x.visits||[];x.visits.push({d:Date.now(),n:e.name,c:d.c,notes:d.notes||'',dx:d.dx||'',tx:d.tx||'',rx:(d.rx||[]).filter(r=>r.n)});e.st='done';delete S.drafts[e.t];roomKey='';save();render();toast('تم حفظ الكشف',e.name)},
search:v=>{mq=v;pRes()},close:()=>{$('cx-modal').className='hidden'},
view:c=>{const p=P(c);modal(`<div class="flex justify-between items-start mb-4"><div><h3 class="font-bold text-[20px] text-[#0B2545]">${E(p.name)}</h3><div class="text-[13px] text-[#64748B] font-mono ltr-text">${E(p.code)}</div></div><div class="flex gap-2"><button class="${B2}" onclick="CX.edit('${c}')">تعديل</button><button class="${B2}" onclick="CX.close()">إغلاق</button></div></div><div class="grid grid-cols-2 gap-2 text-[13px] mb-4"><div class="bg-slate-50 rounded-lg p-3">السن: <b>${p.age}</b></div><div class="bg-slate-50 rounded-lg p-3">النوع: <b>${E(p.gender)}</b></div><div class="bg-slate-50 rounded-lg p-3">الهاتف: <b class="font-mono">${E(p.phone)}</b></div><div class="bg-slate-50 rounded-lg p-3">العنوان: <b>${E(p.address)}</b></div></div><h4 class="font-bold mb-2">التاريخ المرضي</h4>${p.h?hView(p.h):'<p class="text-[13px] text-[#64748B]">لم يُسجل بعد</p>'}<h4 class="font-bold mt-4 mb-2">الزيارات (${p.visits.length})</h4>${p.visits.slice().reverse().map((v,i)=>`<div class="border border-[#E2E8F0] rounded-lg p-3 mb-2 text-[13px]"><div class="flex justify-between"><b>${fd(v.d)}</b><button class="text-[#0F7C82] font-bold" onclick="CX.pv('${c}',${p.visits.length-1-i})">طباعة الروشتة</button></div><div>الشكوى: ${E(v.c)}</div><div>الملاحظات: ${E(v.notes)}</div><div>التشخيص: <b>${E(v.dx)}</b></div><div>العلاج: ${E(v.tx)}</div>${v.rx.length?`<div class="text-[#64748B]">الروشتة: ${v.rx.map(r=>E(r.n+' '+r.d)).join(' • ')}</div>`:''}</div>`).join('')||'<p class="text-[13px] text-[#64748B]">لا توجد زيارات سابقة</p>'}`)},
pv:(c,i)=>{const p=P(c),v=p.visits[i];printRx(p.name,p.age,fd(v.d),v.dx,v.rx)},
edit:c=>{const p=c?P(c):{name:'',phone:'',age:'',gender:'ذكر',address:'',h:null};modal(`<h3 class="font-bold text-[18px] text-[#0B2545] mb-4">${c?'تعديل بيانات المريض':'تسجيل مريض جديد'}</h3><div class="grid sm:grid-cols-2 gap-3 mb-4"><div><label class="${LB}">الاسم</label><input id="e-name" class="${IN}" value="${E(p.name)}"></div><div><label class="${LB}">الهاتف</label><input id="e-phone" class="${IN}" value="${E(p.phone)}"></div><div><label class="${LB}">السن</label><input id="e-age" type="number" class="${IN}" value="${E(p.age)}"></div><div><label class="${LB}">النوع</label><select id="e-gender" class="${IN}"><option ${p.gender!=='أنثى'?'selected':''}>ذكر</option><option ${p.gender==='أنثى'?'selected':''}>أنثى</option></select></div><div class="sm:col-span-2"><label class="${LB}">العنوان</label><input id="e-addr" class="${IN}" value="${E(p.address)}"></div></div><h4 class="font-bold mb-2">التاريخ المرضي</h4>${hForm(p.h,'eh-')}<div class="flex gap-2 mt-5"><button class="${B1}" onclick="CX.saveP('${c}')">حفظ</button><button class="${B2}" onclick="CX.close()">إلغاء</button></div>`)},
saveP:c=>{const n=$('e-name').value.trim();if(n.length<3){toast('اكتب اسم المريض كامل','',1);return}const code=c||('26-'+pad(S.nc).padStart(4,'0'));if(!c)S.nc++;const x=SP(code);x.name=n;x.phone=$('e-phone').value.trim();x.age=parseInt($('e-age').value)||'';x.gender=$('e-gender').value;x.address=$('e-addr').value.trim();x.visits=x.visits||[];const h=getH('eh-');if(h.chronic!=='لا يوجد'||h.allergy!=='لا يوجد'||h.meds!=='لا يوجد'||h.surg!=='لا يوجد'||x.h)x.h=h;save();CX.close();$('dbody').dataset.tab='';render();toast(c?'تم تحديث البيانات':'تم تسجيل المريض',n+' — '+code)},
reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}mem=null;location.reload()}};

RV=$('page-outlet').firstElementChild;

document.body.insertAdjacentHTML('afterbegin',`<div id="cx-mode" class="bg-[#0B2545] text-white h-11 px-6 flex items-center justify-between text-[13px]"><div class="flex items-center gap-3"><span class="opacity-70">عرض كـ:</span><div class="flex p-0.5 bg-white/10 rounded-lg gap-0.5"><button id="cx-m-r" type="button">موظف الاستقبال</button><button id="cx-m-d" type="button">الطبيب<span id="cx-badge" class="hidden px-1.5 rounded-full bg-[#DC2626] text-[11px]"></span></button></div></div><button type="button" class="opacity-60 hover:opacity-100 text-[12px]" onclick="if(confirm('إعادة ضبط كل البيانات التجريبية؟'))CX.reset()">إعادة ضبط البيانات</button></div>`);
$('cx-m-r').onclick=()=>setMode('r');$('cx-m-d').onclick=()=>setMode('d');
RV.insertAdjacentHTML('afterend','<div id="doctor-root" class="hidden flex-col gap-5"><div id="dnav"></div><div id="dbody"></div></div>');

window.addEventListener('storage',e=>{if(e.key===KEY)sync()});if(bc)bc.onmessage=sync;
const clk=()=>{const d=new Date(),f=document.querySelector('header .font-mono');if(f)f.innerHTML=tm(d).slice(0,5)+' <span class="text-[17px] font-semibold text-[#0F7C82] font-sans">'+tm(d).slice(-1)+'</span>';const dt=[...document.querySelectorAll('header span')].find(s=>/\d{4}$/.test(s.textContent.trim())&&s.className.includes('text-[14px]'));if(dt)dt.textContent=d.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderR()};
clk();setInterval(clk,30000);
setMode(mode)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
